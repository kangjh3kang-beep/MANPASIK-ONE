# ManPaSik NetworkPolicy — 서비스 간 트래픽 격리
# 원칙: 기본 deny + 필요한 통신만 허용

# ============================================================================
# 1. 기본 거부 정책 — 네임스페이스 내 모든 인바운드 차단
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: manpasik
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# ============================================================================
# 2. Gateway 허용 — 외부(Ingress Controller) → Gateway만 허용
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: manpasik
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

---
# ============================================================================
# 3. Gateway → gRPC 서비스 허용 (포트 50051)
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-grpc
  namespace: manpasik
spec:
  podSelector:
    matchLabels:
      tier: grpc-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 50051

---
# ============================================================================
# 4. Prometheus 스크래핑 허용 (메트릭 포트 9100)
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: manpasik
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9100

---
# ============================================================================
# 5. 서비스 간 gRPC 통신 허용 (같은 네임스페이스 내 tier: grpc-service)
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inter-service-grpc
  namespace: manpasik
spec:
  podSelector:
    matchLabels:
      tier: grpc-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: grpc-service
      ports:
        - protocol: TCP
          port: 50051

---
# ============================================================================
# 6. DB 접근 — 서비스 → PostgreSQL (포트 5432)
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-service-to-postgres
  namespace: manpasik
spec:
  podSelector:
    matchLabels:
      app: postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: grpc-service
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 5432

---
# ============================================================================
# 7. Kafka 접근 — 이벤트 발행/구독 서비스 → Kafka (포트 9092)
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-service-to-kafka
  namespace: manpasik
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: grpc-service
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 9092
