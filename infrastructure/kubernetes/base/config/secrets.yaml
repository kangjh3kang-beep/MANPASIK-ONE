# =============================================================================
# ManPaSik — ExternalSecret CRD
# 실제 시크릿은 외부 시크릿 스토어(Vault/AWS SM)에서 주입됩니다.
# 로컬 개발 시: kubectl create secret generic manpasik-secrets --from-env-file=.env
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: manpasik-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: manpasik-secret-store
    kind: ClusterSecretStore
  target:
    name: manpasik-secrets
    creationPolicy: Owner
  data:
    # PostgreSQL
    - secretKey: POSTGRES_USER
      remoteRef:
        key: manpasik/database
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: manpasik/database
        property: password
    - secretKey: DB_PASSWORD
      remoteRef:
        key: manpasik/database
        property: password

    # Redis
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: manpasik/redis
        property: password

    # Keycloak
    - secretKey: KEYCLOAK_ADMIN
      remoteRef:
        key: manpasik/keycloak
        property: admin_user
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: manpasik/keycloak
        property: admin_password

    # JWT
    - secretKey: JWT_SECRET
      remoteRef:
        key: manpasik/auth
        property: jwt_secret
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: manpasik/auth
        property: jwt_secret

    # Encryption
    - secretKey: ENCRYPTION_MASTER_KEY
      remoteRef:
        key: manpasik/encryption
        property: master_key

    # Payment
    - secretKey: PAYMENT_API_KEY
      remoteRef:
        key: manpasik/payment
        property: api_key
    - secretKey: PAYMENT_SECRET_KEY
      remoteRef:
        key: manpasik/payment
        property: secret_key

    # AI
    - secretKey: AI_MODEL_API_KEY
      remoteRef:
        key: manpasik/ai
        property: api_key

    # Notifications
    - secretKey: FCM_SERVER_KEY
      remoteRef:
        key: manpasik/notifications
        property: fcm_server_key
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: manpasik/notifications
        property: smtp_password

    # Video
    - secretKey: VIDEO_STREAM_SECRET
      remoteRef:
        key: manpasik/video
        property: stream_secret
---
# 로컬 개발용 SecretStore (Vault dev 서버)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: manpasik-secret-store
spec:
  provider:
    vault:
      server: "http://vault.vault-system.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "manpasik"
