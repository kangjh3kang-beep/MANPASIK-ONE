apiVersion: v1
kind: ConfigMap
metadata:
  name: manpasik-config
data:
  # Environment
  ENVIRONMENT: "development"
  LOG_LEVEL: "info"

  # Database (manpasik-data namespace)
  DB_HOST: "postgres.manpasik-data.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "manpasik"
  DB_SSLMODE: "require"
  POSTGRES_HOST: "postgres.manpasik-data.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "manpasik"

  # TimescaleDB
  TIMESCALE_HOST: "timescaledb.manpasik-data.svc.cluster.local"
  TIMESCALE_PORT: "5432"
  TIMESCALE_DB: "manpasik_ts"

  # Redis
  REDIS_HOST: "redis.manpasik-data.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_ADDR: "redis.manpasik-data.svc.cluster.local:6379"

  # Kafka / Redpanda
  KAFKA_BROKERS: "redpanda.manpasik-data.svc.cluster.local:9092"

  # Milvus (Vector DB)
  MILVUS_HOST: "milvus.manpasik-data.svc.cluster.local"
  MILVUS_PORT: "19530"

  # Keycloak
  KEYCLOAK_URL: "http://keycloak.manpasik.svc.cluster.local:8080"
  KEYCLOAK_REALM: "manpasik"

  # Service addresses for cross-service communication (gRPC)
  AUTH_SERVICE_ADDR: "auth-service:50051"
  USER_SERVICE_ADDR: "user-service:50052"
  DEVICE_SERVICE_ADDR: "device-service:50053"
  MEASUREMENT_SERVICE_ADDR: "measurement-service:50054"
  SUBSCRIPTION_SERVICE_ADDR: "subscription-service:50055"
  SHOP_SERVICE_ADDR: "shop-service:50056"
  PAYMENT_SERVICE_ADDR: "payment-service:50057"
  AI_INFERENCE_SERVICE_ADDR: "ai-inference-service:50058"
  CARTRIDGE_SERVICE_ADDR: "cartridge-service:50059"
  CALIBRATION_SERVICE_ADDR: "calibration-service:50060"
  COACHING_SERVICE_ADDR: "coaching-service:50061"
  FAMILY_SERVICE_ADDR: "family-service:50063"
  HEALTH_RECORD_SERVICE_ADDR: "health-record-service:50064"
  COMMUNITY_SERVICE_ADDR: "community-service:50065"
  RESERVATION_SERVICE_ADDR: "reservation-service:50066"
  ADMIN_SERVICE_ADDR: "admin-service:50068"
  AUDIT_SERVICE_ADDR: "audit-service:50072"
  AUDIT_INTAKE_URL: "http://audit-service:9100/audit/events"
  NOTIFICATION_SERVICE_ADDR: "notification-service:50062"
  PRESCRIPTION_SERVICE_ADDR: "prescription-service:50069"
  VIDEO_SERVICE_ADDR: "video-service:50070"
  TRANSLATION_SERVICE_ADDR: "translation-service:50073"

  # Service FQDN addresses (fully qualified)
  AUTH_SERVICE_URL: "auth-service.manpasik.svc.cluster.local:50051"
  USER_SERVICE_URL: "user-service.manpasik.svc.cluster.local:50052"
  DEVICE_SERVICE_URL: "device-service.manpasik.svc.cluster.local:50053"
  MEASUREMENT_SERVICE_URL: "measurement-service.manpasik.svc.cluster.local:50054"
  SUBSCRIPTION_SERVICE_URL: "subscription-service.manpasik.svc.cluster.local:50055"
  SHOP_SERVICE_URL: "shop-service.manpasik.svc.cluster.local:50056"
  PAYMENT_SERVICE_URL: "payment-service.manpasik.svc.cluster.local:50057"
  AI_INFERENCE_SERVICE_URL: "ai-inference-service.manpasik.svc.cluster.local:50058"
  CARTRIDGE_SERVICE_URL: "cartridge-service.manpasik.svc.cluster.local:50059"
  CALIBRATION_SERVICE_URL: "calibration-service.manpasik.svc.cluster.local:50060"
  COACHING_SERVICE_URL: "coaching-service.manpasik.svc.cluster.local:50061"
  FAMILY_SERVICE_URL: "family-service.manpasik.svc.cluster.local:50063"
  HEALTH_RECORD_SERVICE_URL: "health-record-service.manpasik.svc.cluster.local:50064"
  COMMUNITY_SERVICE_URL: "community-service.manpasik.svc.cluster.local:50065"
  RESERVATION_SERVICE_URL: "reservation-service.manpasik.svc.cluster.local:50066"
  ADMIN_SERVICE_URL: "admin-service.manpasik.svc.cluster.local:50068"
  AUDIT_SERVICE_URL: "audit-service.manpasik.svc.cluster.local:50072"
  NOTIFICATION_SERVICE_URL: "notification-service.manpasik.svc.cluster.local:50062"
  PRESCRIPTION_SERVICE_URL: "prescription-service.manpasik.svc.cluster.local:50069"
  VIDEO_SERVICE_URL: "video-service.manpasik.svc.cluster.local:50070"
  TRANSLATION_SERVICE_URL: "translation-service.manpasik.svc.cluster.local:50073"

  # Vision service (Phase 5)
  VISION_SERVICE_ADDR: "vision-service:50072"
  VISION_SERVICE_URL: "vision-service.manpasik.svc.cluster.local:50072"
  TELEMEDICINE_SERVICE_ADDR: "telemedicine-service:50071"
  TELEMEDICINE_SERVICE_URL: "telemedicine-service.manpasik.svc.cluster.local:50071"

  # ManPaSik domain settings
  MAX_FINGERPRINT_DIMENSION: "1792"
  DEFAULT_ALPHA: "0.98"
  OFFLINE_MODE_ENABLED: "true"

  # ===== 운영 인프라 (Phase N/S/T/U/V) =====

  # 멀티테넌트 RBAC (점진 도입)
  # true 시 telemedicine/health-record/family/auth 등 wire-up 된 서비스에서 인터셉터 활성
  TENANCY_ENFORCED: "false"

  # OTLP 분산 추적 — HTTP exporter
  # 운영 collector 주소 (예: "http://otel-collector.manpasik-ops.svc.cluster.local:4318/v1/traces")
  OTLP_HTTP_ENDPOINT: ""
  OTLP_BATCH_SIZE: "100"
  OTLP_FLUSH_TIMEOUT_SECONDS: "5"

  # OTLP 분산 추적 — gRPC exporter
  # 운영 collector gRPC 주소 (예: "otel-collector.manpasik-ops.svc.cluster.local:4317")
  OTLP_GRPC_ENDPOINT: ""

  # 백업 (PgDumpProvider + ObjectStorage)
  BACKUP_OUTPUT_DIR: "/var/manpasik/backups"
  BACKUP_FORMAT: "custom"               # plain | custom | directory | tar
  BACKUP_RETENTION_DAYS: "30"
  # 외부 객체 저장소 (HTTPObjectStorage 또는 S3 어댑터)
  BACKUP_STORAGE_BASE_URL: ""           # 예: "https://r2.manpasik.com/backups"
  BACKUP_LIST_ENDPOINT: ""

  # Vault Secrets (HTTP 직결)
  VAULT_ADDR: ""                        # 예: "http://vault.manpasik-ops.svc.cluster.local:8200"
  VAULT_KV_MOUNT: "secret"

  # 운영 대시보드
  OPS_DASHBOARD_PATH_PREFIX: "/ops"
  OPS_DASHBOARD_SNAPSHOT_TIMEOUT_SECONDS: "5"
