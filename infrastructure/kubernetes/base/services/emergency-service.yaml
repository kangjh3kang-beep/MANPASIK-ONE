apiVersion: apps/v1
kind: Deployment
metadata:
  name: emergency-service
  labels:
    app: emergency-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emergency-service
  template:
    metadata:
      labels:
        app: emergency-service
        tier: backend
    spec:
      containers:
        - name: emergency-service
          image: manpasik/emergency-service:latest
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9100
              name: metrics
          envFrom:
            - configMapRef:
                name: manpasik-config
            - secretRef:
                name: manpasik-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9100
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: emergency-service
spec:
  selector:
    app: emergency-service
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 9100
      targetPort: 9100
      name: metrics
