# Staging environment: config overrides
apiVersion: v1
kind: ConfigMap
metadata:
  name: manpasik-config
data:
  ENVIRONMENT: "staging"
  LOG_LEVEL: "info"
  DB_SSLMODE: "require"
  # Staging: 테넌시 활성 (production 직전 검증)
  TENANCY_ENFORCED: "true"
  OTLP_HTTP_ENDPOINT: "http://otel-collector.manpasik-ops-staging.svc.cluster.local:4318/v1/traces"
  OTLP_GRPC_ENDPOINT: "otel-collector.manpasik-ops-staging.svc.cluster.local:4317"
  BACKUP_RETENTION_DAYS: "14"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: manpasik-ingress
spec:
  tls:
    - hosts:
        - api.staging.manpasik.com
      secretName: manpasik-staging-tls
  rules:
    - host: api.staging.manpasik.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
