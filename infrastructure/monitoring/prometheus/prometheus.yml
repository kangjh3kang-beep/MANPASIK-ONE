# ManPaSik Prometheus 스크래핑 설정
# docker-compose.dev.yml 기준 gRPC 서비스 메트릭 수집

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: manpasik
    environment: production

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Prometheus 자체 모니터링
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # gRPC 마이크로서비스 (메트릭 포트 :9100)
  - job_name: grpc-auth-service
    static_configs:
      - targets: ["auth-service:9100"]
        labels:
          service: auth-service

  - job_name: grpc-user-service
    static_configs:
      - targets: ["user-service:9100"]
        labels:
          service: user-service

  - job_name: grpc-device-service
    static_configs:
      - targets: ["device-service:9100"]
        labels:
          service: device-service

  - job_name: grpc-measurement-service
    static_configs:
      - targets: ["measurement-service:9100"]
        labels:
          service: measurement-service

  - job_name: grpc-subscription-service
    static_configs:
      - targets: ["subscription-service:9100"]
        labels:
          service: subscription-service

  - job_name: grpc-shop-service
    static_configs:
      - targets: ["shop-service:9100"]
        labels:
          service: shop-service

  - job_name: grpc-payment-service
    static_configs:
      - targets: ["payment-service:9100"]
        labels:
          service: payment-service

  - job_name: grpc-ai-inference-service
    static_configs:
      - targets: ["ai-inference-service:9100"]
        labels:
          service: ai-inference-service

  - job_name: grpc-cartridge-service
    static_configs:
      - targets: ["cartridge-service:9100"]
        labels:
          service: cartridge-service

  - job_name: grpc-calibration-service
    static_configs:
      - targets: ["calibration-service:9100"]
        labels:
          service: calibration-service

  - job_name: grpc-coaching-service
    static_configs:
      - targets: ["coaching-service:9100"]
        labels:
          service: coaching-service

  - job_name: grpc-family-service
    static_configs:
      - targets: ["family-service:9100"]
        labels:
          service: family-service

  - job_name: grpc-health-record-service
    static_configs:
      - targets: ["health-record-service:9100"]
        labels:
          service: health-record-service

  - job_name: grpc-community-service
    static_configs:
      - targets: ["community-service:9100"]
        labels:
          service: community-service

  - job_name: grpc-reservation-service
    static_configs:
      - targets: ["reservation-service:9100"]
        labels:
          service: reservation-service

  - job_name: grpc-admin-service
    static_configs:
      - targets: ["admin-service:9100"]
        labels:
          service: admin-service

  - job_name: grpc-notification-service
    static_configs:
      - targets: ["notification-service:9100"]
        labels:
          service: notification-service

  - job_name: grpc-prescription-service
    static_configs:
      - targets: ["prescription-service:9100"]
        labels:
          service: prescription-service

  - job_name: grpc-video-service
    static_configs:
      - targets: ["video-service:9100"]
        labels:
          service: video-service

  - job_name: grpc-telemedicine-service
    static_configs:
      - targets: ["telemedicine-service:9100"]
        labels:
          service: telemedicine-service

  - job_name: grpc-vision-service
    static_configs:
      - targets: ["vision-service:9100"]
        labels:
          service: vision-service

  - job_name: grpc-translation-service
    static_configs:
      - targets: ["translation-service:9100"]
        labels:
          service: translation-service

  # Gateway (REST)
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9100"]
        labels:
          service: gateway

  # 추가 gRPC 서비스
  - job_name: grpc-audit-service
    static_configs:
      - targets: ["audit-service:9100"]
        labels:
          service: audit-service

  - job_name: grpc-digital-twin-service
    static_configs:
      - targets: ["digital-twin-service:9100"]
        labels:
          service: digital-twin-service

  - job_name: grpc-assistant-service
    static_configs:
      - targets: ["assistant-service:9100"]
        labels:
          service: assistant-service

  - job_name: grpc-concept-service
    static_configs:
      - targets: ["concept-service:9100"]
        labels:
          service: concept-service

  - job_name: grpc-cartridge-store-service
    static_configs:
      - targets: ["cartridge-store-service:9100"]
        labels:
          service: cartridge-store-service

  - job_name: grpc-data-platform-service
    static_configs:
      - targets: ["data-platform-service:9100"]
        labels:
          service: data-platform-service

  - job_name: grpc-voice-profile-service
    static_configs:
      - targets: ["voice-profile-service:9100"]
        labels:
          service: voice-profile-service

  # 추가 HTTP 서비스
  - job_name: http-analytics-service
    static_configs:
      - targets: ["analytics-service:9100"]
        labels:
          service: analytics-service

  - job_name: http-emergency-service
    static_configs:
      - targets: ["emergency-service:9100"]
        labels:
          service: emergency-service

  - job_name: http-iot-gateway-service
    static_configs:
      - targets: ["iot-gateway-service:9100"]
        labels:
          service: iot-gateway-service

  - job_name: http-marketplace-service
    static_configs:
      - targets: ["marketplace-service:9100"]
        labels:
          service: marketplace-service

  - job_name: http-nlp-service
    static_configs:
      - targets: ["nlp-service:9100"]
        labels:
          service: nlp-service

  # ============================================================================
  # 인프라 모니터링 (Phase G 추가)
  # ============================================================================

  # Kubernetes 클러스터 상태 (kube-state-metrics)
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics.monitoring:8080"]

  # 노드 시스템 메트릭 (node-exporter)
  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__address__]
        regex: (.+):(.+)
        target_label: __address__
        replacement: ${1}:9100
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node

  # PostgreSQL (postgres-exporter)
  - job_name: postgresql
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgresql

  # Redis (redis-exporter)
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis

  # Kafka (kafka-exporter)
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          service: kafka

  # NGINX Ingress Controller
  - job_name: nginx-ingress
    static_configs:
      - targets: ["ingress-nginx-controller.ingress-nginx:10254"]
        labels:
          service: nginx-ingress
