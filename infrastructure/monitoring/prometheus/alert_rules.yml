# ManPaSik Prometheus 알림 규칙
# SLI/SLO 기반 핵심 알림

groups:
  # ============================================================================
  # 서비스 가용성 (SLO: 99.9%)
  # ============================================================================
  - name: service_availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "서비스 다운: {{ $labels.service }}"
          description: "{{ $labels.service }}가 1분 이상 응답하지 않습니다."

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(grpc_server_handled_total{grpc_code!="OK"}[5m])) by (grpc_service)
            /
            sum(rate(grpc_server_handled_total[5m])) by (grpc_service)
          ) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "높은 에러율: {{ $labels.grpc_service }}"
          description: "{{ $labels.grpc_service }} 에러율 {{ $value | humanizePercentage }}가 1%를 초과합니다."

      - alert: CriticalErrorRate
        expr: |
          (
            sum(rate(grpc_server_handled_total{grpc_code!="OK"}[5m])) by (grpc_service)
            /
            sum(rate(grpc_server_handled_total[5m])) by (grpc_service)
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "심각한 에러율: {{ $labels.grpc_service }}"
          description: "{{ $labels.grpc_service }} 에러율 {{ $value | humanizePercentage }}가 5%를 초과합니다."

  # ============================================================================
  # 레이턴시 (SLO: p99 < 500ms)
  # ============================================================================
  - name: latency
    rules:
      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum(rate(grpc_server_handling_seconds_bucket[5m])) by (grpc_service, le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "높은 레이턴시: {{ $labels.grpc_service }}"
          description: "{{ $labels.grpc_service }} p99 레이턴시가 500ms를 초과합니다 ({{ $value | humanizeDuration }})."

      - alert: CriticalLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum(rate(grpc_server_handling_seconds_bucket[5m])) by (grpc_service, le)
          ) > 2.0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "심각한 레이턴시: {{ $labels.grpc_service }}"
          description: "{{ $labels.grpc_service }} p99 레이턴시가 2초를 초과합니다."

  # ============================================================================
  # 리소스 사용량
  # ============================================================================
  - name: resource_usage
    rules:
      - alert: HighMemoryUsage
        expr: |
          (
            container_memory_working_set_bytes
            /
            container_spec_memory_limit_bytes
          ) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "높은 메모리 사용량: {{ $labels.container }}"
          description: "{{ $labels.container }} 메모리 사용량이 85%를 초과합니다."

      - alert: HighCPUUsage
        expr: |
          (
            sum(rate(container_cpu_usage_seconds_total[5m])) by (container)
            /
            sum(container_spec_cpu_quota / container_spec_cpu_period) by (container)
          ) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "높은 CPU 사용량: {{ $labels.container }}"
          description: "{{ $labels.container }} CPU 사용량이 85%를 초과합니다."

      - alert: PodRestartLoop
        expr: increase(kube_pod_container_status_restarts_total[1h]) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod 재시작 반복: {{ $labels.pod }}"
          description: "{{ $labels.pod }}가 1시간 내 5회 이상 재시작되었습니다."

  # ============================================================================
  # 비즈니스 메트릭 (측정/응급)
  # ============================================================================
  - name: business_metrics
    rules:
      - alert: MeasurementServiceDegraded
        expr: |
          sum(rate(grpc_server_handled_total{grpc_service="manpasik.MeasurementService",grpc_code!="OK"}[5m]))
          /
          sum(rate(grpc_server_handled_total{grpc_service="manpasik.MeasurementService"}[5m]))
          > 0.005
        for: 3m
        labels:
          severity: critical
          business_impact: high
        annotations:
          summary: "측정 서비스 성능 저하"
          description: "측정 서비스 에러율이 0.5%를 초과합니다. 핵심 비즈니스 기능에 영향을 줄 수 있습니다."

      - alert: EmergencyServiceDown
        expr: up{service="emergency-service"} == 0
        for: 30s
        labels:
          severity: critical
          business_impact: critical
        annotations:
          summary: "응급 서비스 다운"
          description: "응급 서비스가 30초 이상 응답하지 않습니다. 즉시 조치가 필요합니다."

      - alert: PaymentServiceErrors
        expr: |
          sum(rate(grpc_server_handled_total{grpc_service="manpasik.PaymentService",grpc_code!="OK"}[5m]))
          > 0
        for: 2m
        labels:
          severity: warning
          business_impact: high
        annotations:
          summary: "결제 서비스 에러 발생"
          description: "결제 서비스에서 에러가 발생하고 있습니다."

  # ============================================================================
  # 데이터베이스
  # ============================================================================
  - name: database
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL 다운"
          description: "PostgreSQL 인스턴스가 1분 이상 응답하지 않습니다."

      - alert: HighDatabaseConnections
        expr: |
          sum(pg_stat_activity_count) by (datname)
          /
          sum(pg_settings_max_connections) by (datname)
          > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "높은 DB 커넥션 사용: {{ $labels.datname }}"
          description: "{{ $labels.datname }} DB 커넥션 사용률이 80%를 초과합니다."

  # ============================================================================
  # 인프라 메트릭 (Phase G 추가)
  # ============================================================================
  - name: infrastructure
    rules:
      - alert: NodeHighCPU
        expr: 100 - (avg by(node) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "노드 CPU 과부하: {{ $labels.node }}"
          description: "{{ $labels.node }} CPU 사용률이 85%를 10분 이상 초과합니다."

      - alert: NodeHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "노드 메모리 부족: {{ $labels.node }}"
          description: "{{ $labels.node }} 메모리 사용률이 90%를 초과합니다."

      - alert: NodeDiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "디스크 공간 부족: {{ $labels.node }}"
          description: "{{ $labels.node }} 디스크 사용률이 85%를 초과합니다 ({{ $labels.mountpoint }})."

      - alert: KafkaConsumerLag
        expr: kafka_consumergroup_lag_sum > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka 소비자 지연: {{ $labels.consumergroup }}"
          description: "{{ $labels.consumergroup }} 소비자 그룹의 지연이 10,000건을 초과합니다."

      - alert: IngressHighErrorRate
        expr: |
          sum(rate(nginx_ingress_controller_requests{status=~"5.."}[5m]))
          /
          sum(rate(nginx_ingress_controller_requests[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ingress 높은 에러율"
          description: "NGINX Ingress 5xx 에러율이 5%를 초과합니다."

      - alert: IngressHighLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(nginx_ingress_controller_request_duration_seconds_bucket[5m])) by (le)
          ) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ingress 높은 레이턴시"
          description: "NGINX Ingress p99 레이턴시가 5초를 초과합니다."

  # ============================================================================
  # Tenancy 운영 (Phase AF-2)
  # 멀티테넌트 멤버십/초대 운영 안전성 모니터링
  # ============================================================================
  - name: tenancy
    rules:
      - alert: TenancyExpiredInvitationsPiling
        expr: manpasik_tenancy_invitations_total{status="expired"} > 20
        for: 30m
        labels:
          severity: warning
          category: tenancy
        annotations:
          summary: "만료 초대 누적 (>20)"
          description: "InvitationCleaner 가 정상 동작하는지 확인. 현재 만료 초대 = {{  }}"

      - alert: TenancyPendingInvitationsStuck
        expr: manpasik_tenancy_invitations_total{status="pending"} > 50
        for: 1h
        labels:
          severity: warning
          category: tenancy
        annotations:
          summary: "수락 대기 중 초대 다수 (>50)"
          description: "발급은 되었으나 수락 안 된 초대가 1시간 이상 50개 초과. 알림 발송 실패 가능성."

      - alert: TenancyZeroMemberTenants
        # 활성 멤버 수가 0 인데 tenant_count 가 0 보다 큰 경우 (모든 조직이 비어있음)
        expr: manpasik_tenancy_members_active_total == 0 AND manpasik_tenancy_tenants_total > 0
        for: 5m
        labels:
          severity: critical
          category: tenancy
        annotations:
          summary: "모든 조직에 활성 멤버 0명"
          description: "멤버십 데이터 손실 또는 동기화 실패 가능성. 즉시 확인 필요."

      - alert: TenancyHighInactiveMemberRatio
        # 비활성 멤버 비율 > 30%
        expr: |
          (manpasik_tenancy_members_inactive_total
           / (manpasik_tenancy_members_inactive_total + manpasik_tenancy_members_active_total))
          > 0.3
        for: 30m
        labels:
          severity: info
          category: tenancy
        annotations:
          summary: "비활성 멤버 비율 높음 (>30%)"
          description: "비활성 = {{  }}. 운영자 확인 필요 (대량 탈퇴 또는 정지 패턴)."

      - alert: TenancyAdminCountTooLow
        # admin 멤버가 1명 이하 (그룹당 admin 부재 위험)
        expr: manpasik_tenancy_role_distribution{role="admin"} + manpasik_tenancy_role_distribution{role="owner"} < manpasik_tenancy_tenants_total
        for: 10m
        labels:
          severity: warning
          category: tenancy
        annotations:
          summary: "일부 조직에 admin/owner 부족"
          description: "admin+owner 합계 = {{  }} < tenant 수. 권한 위임 필요."
