# ManPaSik Monitoring Stack — Loki + Promtail + Jaeger
# 사용법: docker compose -f docker-compose.monitoring.yml up -d
#
# 이 파일은 기존 docker-compose.yml 과 함께 overlay 로 사용하거나
# 단독 실행하여 모니터링 인프라만 띄울 수 있습니다.

version: "3.9"

networks:
  monitoring:
    driver: bridge

volumes:
  loki-data:
  jaeger-data:

services:
  # ──────────────────────────────────────────────
  # Jaeger — 분산 트레이싱 (OTLP 수집 + UI)
  # ──────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: manpasik-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "14268:14268"   # Jaeger HTTP Thrift
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: "badger"
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: "/badger/data"
      BADGER_DIRECTORY_KEY: "/badger/key"
    volumes:
      - jaeger-data:/badger
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────
  # Loki — 로그 수집/검색 엔진
  # ──────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.6
    container_name: manpasik-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Promtail — 로그 에이전트 (→ Loki)
  # ──────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.6
    container_name: manpasik-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - monitoring
