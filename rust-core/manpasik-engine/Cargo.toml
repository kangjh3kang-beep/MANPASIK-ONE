[package]
name = "manpasik-engine"
version = "0.1.0"
edition = "2021"
description = "ManPaSik AI 코어 엔진 — 카트리지 비전 분석 + 바이오마커 추론"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ndarray = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
