[package]
name = "manpasik-engine"
version = "0.1.0"
edition = "2021"
description = "ManPaSik AI 코어 엔진 — 카트리지 비전 분석 + 바이오마커 추론"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# Flutter-Rust Bridge
flutter_rust_bridge = "2.12"

# 이미지 처리
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# 수치 연산
ndarray = "0.16"

# 직렬화
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 로깅
log = "0.4"
env_logger = "0.11"

# 에러 핸들링
anyhow = "1"
thiserror = "1"

# BLE (parking_lot 항상 필요, btleplug은 feature 조건부)
parking_lot = "0.12"
btleplug = { version = "0.11", optional = true }

# NFC
hex = "0.4"
chrono = "0.4"

# DSP
rustfft = "6.2"

# 암호화
aes-gcm = "0.10"
ring = "0.17"
sha2 = "0.10"

# Sync/CRDT
uuid = { version = "1", features = ["v4"] }

# 추적 (선택)
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }

[features]
default = []
ble = ["btleplug"]
ai = ["tracing"]
