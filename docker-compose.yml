# ManPaSik AI 생태계 — Docker Compose 통합 환경
# 사용법: docker-compose up -d
version: "3.9"

x-go-service: &go-service
  build:
    context: ./backend
  restart: unless-stopped
  env_file:
    - .env
  environment: &common-env
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: manpasik
    DB_SSLMODE: disable
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    KAFKA_BROKERS: redpanda:19092
    S3_ENDPOINT: minio:9000
    S3_BUCKET: manpasik
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - manpasik

services:
  # ============================================================================
  # 인프라
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: manpasik
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manpasik"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - manpasik

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - manpasik

  redpanda:
    image: redpandadata/redpanda:v24.3.1
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:19092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:19092,external://localhost:9092
    ports:
      - "9092:9092"
      - "19092:19092"
    networks:
      - manpasik

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - manpasik

  # ============================================================================
  # 인증/검색/벡터 인프라
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - manpasik

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ALLOW_NONE_AUTHENTICATION: "yes"
    volumes:
      - etcd_data:/etcd
    networks:
      - manpasik

  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - manpasik

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - manpasik

  # ============================================================================
  # 모니터링 / 옵저버빌리티
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    ports:
      - "9090:9090"
    networks:
      - manpasik

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - manpasik

  jaeger:
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - manpasik

  # ============================================================================
  # Gateway (REST → gRPC)
  # ============================================================================
  gateway:
    <<: *go-service
    build:
      context: ./backend
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      HTTP_PORT: ":8080"
      AUTH_SERVICE_ADDR: auth-service:50051
      USER_SERVICE_ADDR: user-service:50052
      DEVICE_SERVICE_ADDR: device-service:50053
      MEASUREMENT_SERVICE_ADDR: measurement-service:50054
      SUBSCRIPTION_SERVICE_ADDR: subscription-service:50055
      SHOP_SERVICE_ADDR: shop-service:50056
      PAYMENT_SERVICE_ADDR: payment-service:50057
      AI_INFERENCE_SERVICE_ADDR: ai-inference-service:50058
      CARTRIDGE_SERVICE_ADDR: cartridge-service:50059
      CALIBRATION_SERVICE_ADDR: calibration-service:50060
      COACHING_SERVICE_ADDR: coaching-service:50061
      NOTIFICATION_SERVICE_ADDR: notification-service:50062
      FAMILY_SERVICE_ADDR: family-service:50063
      HEALTH_RECORD_SERVICE_ADDR: health-record-service:50064
      TELEMEDICINE_SERVICE_ADDR: telemedicine-service:50065
      RESERVATION_SERVICE_ADDR: reservation-service:50066
      COMMUNITY_SERVICE_ADDR: community-service:50067
      ADMIN_SERVICE_ADDR: admin-service:50068
      PRESCRIPTION_SERVICE_ADDR: prescription-service:50069
      TRANSLATION_SERVICE_ADDR: translation-service:50070
      VIDEO_SERVICE_ADDR: video-service:50071
      AUDIT_SERVICE_ADDR: audit-service:50072
      AUDIT_INTAKE_URL: http://audit-service:9100/audit/events
      DIGITAL_TWIN_SERVICE_ADDR: digital-twin-service:50073
      IOT_GATEWAY_SERVICE_ADDR: iot-gateway-service:50072
      NLP_SERVICE_ADDR: nlp-service:50074
      MARKETPLACE_SERVICE_ADDR: marketplace-service:50075
      AI_TRAINING_SERVICE_ADDR: ai-training-service:50076
      AD_SERVICE_ADDR: ad-service:50077
      INVENTORY_SERVICE_ADDR: inventory-service:50078
      LOGISTICS_SERVICE_ADDR: logistics-service:50079
      LOCATION_SERVICE_ADDR: location-service:50080
      MODERATION_SERVICE_ADDR: moderation-service:50081
    depends_on:
      - auth-service
      - user-service
      - audit-service

  # ============================================================================
  # 마이크로서비스
  # ============================================================================
  auth-service:
    <<: *go-service
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    environment:
      <<: *common-env
      GRPC_PORT: ":50051"

