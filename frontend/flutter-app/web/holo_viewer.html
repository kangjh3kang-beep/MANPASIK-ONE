<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>홀로바디 뷰어</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    html,
    body {
      background: transparent !important;
      width: 100%;
      height: 100%;
    }

    #msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00E5FF;
      font-family: monospace;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.8);
      padding: 8px 14px;
      border-radius: 5px;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>

<body>
  <div id="msg">로딩 중...</div>
  <script src="./js/three.min.js"></script>
  <script src="./js/GLTFLoader.umd.js"></script>
  <script>
    (function () {
      var msg = document.getElementById('msg');
      function setMsg(t) { if (msg) msg.textContent = t; }
      function hideMsg() { if (msg) msg.style.display = 'none'; }

      // URL params
      var params = new URLSearchParams(location.search);
      var legacyGender = params.get('gender') || 'male';
      var profile = params.get('profile') ||
        (legacyGender === 'female' ? 'adult_female' : 'adult_male');
      var colorHex = params.get('color') || '00E5FF';
      var revision = params.get('rev') || '';
      if (typeof THREE === 'undefined' || typeof THREE.GLTFLoader === 'undefined') {
        setMsg('Three.js 로더 초기화 실패');
        return;
      }

      var BASE_COLOR = new THREE.Color('#' + colorHex);

      function withRev(path) {
        if (!revision) return path;
        return path + (path.indexOf('?') >= 0 ? '&' : '?') + 'rev=' + encodeURIComponent(revision);
      }

      // GLB files (user-provided models)
      var PROFILE_FILE_MAP = {
        adult_male: 'Holo_M1.glb',
        adult_female: 'Holo_L1.glb',
        junior_male: 'Holo_junier_m1.glb',
        junior_female: 'Holo_junier_g1.glb',
        baby: 'Holo_baby1.glb'
      };
      var PROFILE_GENDER_MAP = {
        adult_male: 'male',
        adult_female: 'female',
        junior_male: 'male',
        junior_female: 'female',
        baby: 'male'
      };
      var FALLBACK_PROFILE = 'adult_male';
      // Renderer
      // USER FIX: Disable antialias & set precision to mediump. Antialiasing with alpha:true causes
      // massive 'ReadPixels GPU stalls' on Linux CEF software fallback when compositing over Flutter.
      var renderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: false,
        powerPreference: "high-performance",
        precision: "mediump"
      });
      // USER FIX: Force pixel ratio to 1.0 to massively reduce pixel fill rate load on weak GPUs
      renderer.setPixelRatio(1.0);
      renderer.setClearColor(0x000000, 0);
      renderer.domElement.style.cssText = 'display:block;width:100%;height:100%;';
      document.body.appendChild(renderer.domElement);

      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(30, 1, 0.01, 500);

      function resize() {
        var w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      resize();
      window.addEventListener('resize', resize);

      var holoEntries = [];
      var activeLoadToken = 0;

      var scanMinY = -0.8;
      var scanMaxY = 0.8;
      var scanWidth = 1.0;

      var scanWidth = 1.0;

      function updateScanBounds(size) {
        var bodyHeight = Math.max(size.y, 0.8);
        scanMinY = -bodyHeight * 0.52;
        scanMaxY = bodyHeight * 0.52;
      }

      var orgMats = []; // Track materials for time-based animation

      // CUSTOM FRESNEL (RIM LIGHT) SHADER
      // Replaces flat MeshBasicMaterial to emphasize 3D organic curves and depth
      var holoVertexShader = `
        #include <common>
        #include <skinning_pars_vertex>
        #include <morphtarget_pars_vertex>

        varying vec3 vNormal;
        varying vec3 vPositionNormal;
        varying vec3 vLocalPos; // USER FIX: Pass local position for topology-aware scanning

        void main() {
          #include <beginnormal_vertex>
          #include <morphnormal_vertex>
          #include <skinbase_vertex>
          #include <skinnormal_vertex>
          #include <defaultnormal_vertex>

          #include <begin_vertex>
          #include <morphtarget_vertex>
          #include <skinning_vertex>
          #include <project_vertex>

          vNormal = normalize(transformedNormal);
          vPositionNormal = normalize(-mvPosition.xyz);
          vLocalPos = position; // Save original local coordinate bounding
          gl_Position = projectionMatrix * mvPosition;
        }
      `;

      var holoFragmentShader = `
        uniform vec3 uColor;
        uniform float uOpacity;
        uniform float uTime;
        uniform float uScanY; // USER FIX: Dynamic scan plane Y-coordinate
        varying vec3 vNormal;
        varying vec3 vPositionNormal;
        varying vec3 vLocalPos;

        void main() {
          // Fresnel calculation (Dot product of View Vector and Normal)
          vec3 nNormal = normalize(vNormal);
          vec3 nView = normalize(vPositionNormal);
          float dotProduct = clamp(dot(nNormal, nView), -1.0, 1.0);
          
          // USER FIX: Boosted Base Intensity exponent (2.5 -> 1.5) for wider, more aggressive edge glow
          float intensity = pow(max(1.0 - abs(dotProduct), 0.0), 1.5);
          
          // Breathing animation
          float pulse = 0.8 + 0.2 * sin(uTime * 2.0);
          
          // Advanced Topology-Aware Scan Wave
          // Calculate distance from current pixel's Y to the moving ScanY plane
          float distToScan = abs(vLocalPos.y - uScanY);
          
          // USER FIX: Center-line based exponential blending. Thickness reduced to 20% of previous.
          // The exponential curve exp(-dist * factor) creates a highly natural glow radiating perfectly from the center.
          // Inner Core (Laser thin): exp(-distToScan * 1200.0)
          // Outer Soft Blend: exp(-distToScan * 250.0)
          float scanIntensity = exp(-distToScan * 250.0) * 0.8 
                              + exp(-distToScan * 1200.0) * 3.0;
          
          // USER FIX: Massively increase shading volume and base visibility.
          // Base visible alpha (0.70 = highly solid core) + intense geometric glow (intensity * 4.0) + scan wave
          float glowMultiplier = ((0.70 + intensity * 4.0) * pulse) + scanIntensity;
          
          // Multiply standard color by glowMultiplier to allow colors to truly shine out (Additive Blending)
          vec3 finalColor = uColor * glowMultiplier;
          
          // Clamp alpha to prevent over-saturation burn on background, but keep it high
          float finalAlpha = clamp(glowMultiplier, 0.0, 1.0) * uOpacity;
          
          gl_FragColor = vec4(finalColor, finalAlpha);
        }
      `;

      function makeHoloMat(mesh) {
        var mat = new THREE.ShaderMaterial({
          uniforms: {
            uColor: { value: BASE_COLOR.clone() },
            uOpacity: { value: 1.0 },
            uTime: { value: 0.0 },
            uScanY: { value: 0.0 }
          },
          vertexShader: holoVertexShader,
          fragmentShader: holoFragmentShader,
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false,
          depthTest: true,
          blending: THREE.AdditiveBlending
        });

        if (mesh && mesh.isSkinnedMesh) {
          mat.skinning = true;
        }
        if (mesh && mesh.morphTargetInfluences) {
          mat.morphTargets = true;
        }

        // Add to global tracked materials so uTime can be updated
        orgMats.push(mat);
        return mat;
      }

      // Body group
      var bodyGroup = new THREE.Group();
      scene.add(bodyGroup);
      var loader = new THREE.GLTFLoader();
      var currentBodyRoot = null;

      function disposeObject3D(obj) {
        obj.traverse(function (node) {
          if (node.geometry && node.geometry.dispose) {
            node.geometry.dispose();
          }
          var m = node.material;
          if (Array.isArray(m)) {
            m.forEach(function (mat) { if (mat && mat.dispose) mat.dispose(); });
          } else if (m && m.dispose) {
            m.dispose();
          }
        });
      }

      function clearBody() {
        while (bodyGroup.children.length) {
          var child = bodyGroup.children[0];
          bodyGroup.remove(child);
          disposeObject3D(child);
        }
        holoEntries.length = 0;
        bodyGroup.position.set(0, 0, 0);
        currentBodyRoot = null;
      }

      function setBodyRoot(root) {
        if (currentBodyRoot && currentBodyRoot.parent === bodyGroup) {
          bodyGroup.remove(currentBodyRoot);
          disposeObject3D(currentBodyRoot);
        }
        currentBodyRoot = root;
        bodyGroup.add(root);
      }

      function applyHoloMaterials(root) {
        var meshCount = 0;
        var triCount = 0;

        root.traverse(function (child) {
          if (!child.isMesh || !child.geometry) return;

          meshCount += 1;

          if (child.geometry.index) {
            triCount += child.geometry.index.count / 3;
          } else if (child.geometry.attributes && child.geometry.attributes.position) {
            triCount += child.geometry.attributes.position.count / 3;
          }

          // Apply Custom Fresnel Shader
          child.material = makeHoloMat(child);
          child.renderOrder = 1;
          child.frustumCulled = false;

          holoEntries.push({
            mesh: child,
            phase: Math.random() * Math.PI * 2,
            baseOpacity: 1.0 // Opacity is now driven by the Shader uniforms
          });
        });

        return { meshCount: meshCount, triCount: triCount };
      }

      function fitCameraToBody() {
        var box = new THREE.Box3().setFromObject(bodyGroup);
        var center = new THREE.Vector3();
        var size = new THREE.Vector3();
        box.getCenter(center);
        box.getSize(size);

        var maxSize = Math.max(size.x, size.y, size.z);
        var fov = camera.fov * Math.PI / 180;

        // USER FIX: Adjust camera distance to prevent clipping and reduce character size
        // Increased base multiplier to shrink all avatars, and boosted baby specifically.
        var distMultiplier = (profile === 'baby') ? 2.4 : 1.7;
        var dist = (maxSize / 2) / Math.tan(fov / 2) * distMultiplier;

        bodyGroup.position.set(-center.x, -center.y, -center.z);
        camera.position.set(0, 0, dist);
        camera.near = Math.max(0.01, dist / 1000);
        camera.far = Math.max(50, dist * 20);
        camera.lookAt(0, 0, 0);
        camera.updateProjectionMatrix();
        updateScanBounds(size);
      }

      function resolveProfile(profileKey) {
        return PROFILE_FILE_MAP[profileKey] ? profileKey : FALLBACK_PROFILE;
      }

      function candidatePaths(profileKey) {
        var resolved = resolveProfile(profileKey);
        var baseFile = PROFILE_FILE_MAP[resolved];
        var fallbackFile = PROFILE_FILE_MAP[FALLBACK_PROFILE];
        // Relative paths ('models/') are prioritised for better portability
        return [
          "assets/web/models/" + baseFile,
          "models/" + baseFile,
          "./models/" + baseFile,
          "assets/models/" + baseFile,
          "/models/" + baseFile,
          "assets/web/models/" + fallbackFile,
          "models/" + fallbackFile
        ];
      }


      function loadGLB(profileKey) {
        var loadToken = ++activeLoadToken;
        clearBody();
        setMsg('모델 로딩 중...');

        var paths = candidatePaths(profileKey);
        var index = 0;

        function tryLoad() {
          var rawPath = paths[index];
          var path = withRev(rawPath);

          loader.load(
            path,
            function (gltf) {
              if (loadToken !== activeLoadToken) {
                disposeObject3D(gltf.scene);
                return;
              }
              var root = gltf.scene;
              var stats = applyHoloMaterials(root);

              if (!stats.meshCount) {
                if (index < paths.length - 1) {
                  index += 1;
                  tryLoad();
                  return;
                }
                setMsg('메시를 찾을 수 없습니다');
                return;
              }

              if (stats.triCount > 800000) {
                renderer.setPixelRatio(1);
              }

              setBodyRoot(root);
              fitCameraToBody();
              hideMsg();
              var successMsg = 'Hologram loaded successfully: ' + rawPath;
              console.log(successMsg);
              if (window.parent) {
                window.parent.postMessage(JSON.stringify({ type: 'log', value: successMsg }), '*');
              }
            },
            function (xhr) {
              if (loadToken !== activeLoadToken) {
                return;
              }
              if (xhr.total) {
                var p = Math.round(xhr.loaded / xhr.total * 100);
                setMsg('로딩 중 ' + p + '%');
                if (window.parent) {
                  window.parent.postMessage(JSON.stringify({ type: 'progress', value: p }), '*');
                }
              }
            },
            function (err) {
              if (loadToken !== activeLoadToken) {
                return;
              }
              var errMsg = 'GLB load error (' + rawPath + '): ' + (err && err.message ? err.message : String(err));
              console.error(errMsg);
              if (window.parent) {
                window.parent.postMessage(JSON.stringify({ type: 'error', value: errMsg }), '*');
              }
              if (index < paths.length - 1) {
                index += 1;
                tryLoad();
                return;
              }
              setMsg('오류: ' + (err && err.message ? err.message : String(err)));
            }
          );
        }

        tryLoad();
      }

      loadGLB(profile);

      // Organ markers
      var orgMats = [];
      function addOrgan(x, y, z, r, col, spd) {
        var mt = new THREE.ShaderMaterial({
          transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
          uniforms: {
            uTime: { value: 0 },
            uColor: { value: new THREE.Color(col) },
            uSpd: { value: spd }
          },
          vertexShader: 'varying vec3 vN,vP;void main(){vN=normalize(normalMatrix*normal);vP=(modelViewMatrix*vec4(position,1.0)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
          fragmentShader: 'uniform float uTime,uSpd;uniform vec3 uColor;varying vec3 vN,vP;void main(){float f=pow(1.0-abs(dot(normalize(-vP),vN)),2.0);float p=sin(uTime*uSpd)*0.5+0.5;gl_FragColor=vec4(uColor,(0.15+f*0.50)*(0.6+p*0.4));}'
        });
        var m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 12), mt);
        m.position.set(x, y, z);
        scene.add(m);
        orgMats.push(mt);
      }
      addOrgan(0.00, 1.70, 0.04, 0.05, '#2962FF', 5); addOrgan(-0.05, 1.35, 0.08, 0.04, '#FF1744', 4.0);
      addOrgan(-0.12, 1.28, 0.06, 0.05, '#00E5FF', 1.2);
      addOrgan(0.12, 1.28, 0.06, 0.05, '#00E5FF', 1.2);
      addOrgan(0.00, 1.02, 0.07, 0.04, '#FF8F00', 0.8);
      addOrgan(-0.10, 0.86, -0.04, 0.03, '#FFAB00', 0.6);
      addOrgan(0.10, 0.86, -0.04, 0.03, '#FFAB00', 0.6);

      // Particles
      var PC = 60, pGeo = new THREE.BufferGeometry();
      var pArr = new Float32Array(PC * 3);
      var pAng = [], pY = [], pSpd = [], pRad = [];
      for (var i = 0; i < PC; i++) {
        pY.push(Math.random() * 2.0);
        pAng.push(Math.random() * Math.PI * 2);
        pSpd.push(0.10 + Math.random() * 0.30);
        pRad.push(0.20 + Math.random() * 0.30);
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
      var particleMaterial = new THREE.PointsMaterial({
        color: BASE_COLOR,
        size: 0.024,
        transparent: true,
        opacity: 0.5,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      scene.add(new THREE.Points(pGeo, particleMaterial));

      // Animation loop
      var clock = new THREE.Clock();
      (function loop() {
        requestAnimationFrame(loop);
        var t = clock.getElapsedTime();
        bodyGroup.rotation.x = 0;
        bodyGroup.rotation.y = t * 0.12;
        bodyGroup.rotation.z = 0;

        if (bodyGroup.children.length > 1) {
          for (var ci = bodyGroup.children.length - 2; ci >= 0; ci--) {
            var extra = bodyGroup.children[ci];
            bodyGroup.remove(extra);
            disposeObject3D(extra);
          }
          currentBodyRoot = bodyGroup.children.length ? bodyGroup.children[0] : null;
        }

        var sweepBase = Math.sin(t * 0.55) * 0.5 + 0.5;
        var smoothSweep = sweepBase * sweepBase * (3.0 - 2.0 * sweepBase);
        var microDrift = Math.sin(t * 2.8) * 0.010 + Math.sin(t * 1.3 + 1.7) * 0.007;
        var scanY = scanMinY + (scanMaxY - scanMinY) * smoothSweep + microDrift;

        for (var h = 0; h < holoEntries.length; h++) {
          var entry = holoEntries[h];
          if (entry.mesh.material && entry.mesh.material.uniforms) {
            entry.mesh.material.uniforms.uOpacity.value = entry.baseOpacity;
            entry.mesh.material.uniforms.uTime.value = t + entry.phase;
            entry.mesh.material.uniforms.uScanY.value = scanY; // Pass scan height to shader
          }
        }

        // Update organ markers time
        for (var i = 0; i < orgMats.length; i++) {
          if (orgMats[i] && orgMats[i].uniforms) {
            orgMats[i].uniforms.uTime.value = t;
          }
        }

        for (var j = 0; j < orgMats.length; j++) {
          orgMats[j].uniforms.uTime.value = t;
        }

        for (var k = 0; k < PC; k++) {
          var a = pAng[k] + t * pSpd[k];
          pArr[k * 3] = Math.cos(a) * pRad[k];
          pArr[k * 3 + 1] = pY[k] + Math.sin(t * 0.3 + k * 0.4) * 0.06;
          pArr[k * 3 + 2] = Math.sin(a) * pRad[k];
        }
        pGeo.attributes.position.needsUpdate = true;

        renderer.render(scene, camera);
      })();

      // Message bridge
      window.addEventListener('message', function (e) {
        try {
          var d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
          if (d.type === 'setProfile') {
            profile = resolveProfile(d.value);
            legacyGender = PROFILE_GENDER_MAP[profile] || 'male';
            loadGLB(profile);
          }
          if (d.type === 'setGender') {
            legacyGender = d.value === 'female' ? 'female' : 'male';
            profile = legacyGender === 'female' ? 'adult_female' : 'adult_male';
            loadGLB(profile);
          }
          if (d.type === 'setColor') {
            var c = new THREE.Color('#' + d.value);
            BASE_COLOR.copy(c);
            particleMaterial.color.copy(c);
            if (scanGlow.material && scanGlow.material.color) scanGlow.material.color.copy(c);
            if (scanLine.material && scanLine.material.color) scanLine.material.color.copy(c);
            for (var i = 0; i < holoEntries.length; i++) {
              if (holoEntries[i].mesh.material && holoEntries[i].mesh.material.color) {
                holoEntries[i].mesh.material.color.copy(c);
              }
            }
            scene.traverse(function (ch) {
              if (ch.material && ch.material.uniforms && ch.material.uniforms.uColor) {
                ch.material.uniforms.uColor.value.copy(c);
              }
            });
          }
        } catch (_) { }
      });
    })();
  </script>
</body>

</html>
