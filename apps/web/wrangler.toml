#:schema node_modules/wrangler/config-schema.json
# Cloudflare Workers — apps/web (Next.js + @opennextjs/cloudflare adapter)
#
# Phase BY — Vercel 의존 완전 제거 (Pages → Workers 마이그레이션).
#
# @opennextjs/cloudflare 가 Next.js 빌드 결과를 분석하여 다음을 생성:
#   .open-next/worker.js              — Workers 진입점 (SSR/middleware/API)
#   .open-next/assets/                — 정적 자산 (이미지/CSS/JS/font)
#   .open-next/                       — 메타데이터 + manifest
#
# Pages 의 GitHub 자동 빌드 대신 Workers 는 wrangler deploy 또는 Workers Builds
# (GitHub 연동) 로 배포. main 브랜치 push → Workers Builds 자동 트리거.

name = "manpasik-web"
main = ".open-next/worker.js"
compatibility_date = "2025-05-22"
compatibility_flags = ["nodejs_compat"]

# Workers Static Assets — .open-next/assets/ 를 자동 서빙
# binding 은 Worker 내부에서 ASSETS 로 접근 가능
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# 빌드 산출물 디렉토리 — Workers Builds 가 이 경로의 worker.js 를 deploy
# (자동으로 .open-next/worker.js + assets 함께 업로드)

# 사용자 정의 도메인 (Workers 대시보드 또는 API 로 별도 설정):
#   - manpasik.com (production)
#   - www.manpasik.com (production redirect)
