name: CI pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  GO_VERSION: '1.22'
  FLUTTER_VERSION: '3.32.0'
  RUST_TOOLCHAIN: 'stable'

jobs:
  # ============================================================================
  # 0. SSOT Governance (상수/문서 일치성)
  # ============================================================================
  ssot-governance:
    name: SSOT Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SSOT constants
        run: python3 scripts/validate_ssot_constants.py

      - name: Security release gate
        run: bash scripts/security_release_gate.sh

      - name: Assay evidence gate
        run: bash scripts/assay_evidence_gate.sh

      - name: Flutter evidence UI gate policy
        run: bash scripts/flutter_evidence_ui_gate_policy_test.sh

      - name: Flutter web timing collection policy
        run: bash scripts/ci_web_gate_timing_collection_policy_test.sh

      - name: Flutter web timing threshold promotion policy
        run: bash scripts/ci_web_timing_threshold_promotion_policy_test.sh

      - name: Flutter web timing review fixture policy
        run: bash scripts/ci_web_timing_review_fixture_policy_test.sh

      - name: Flutter web release review checklist policy
        run: bash scripts/ci_web_release_review_checklist_policy_test.sh

      - name: Flutter web timing governance index policy
        run: bash scripts/ci_web_timing_governance_index_policy_test.sh

  # ============================================================================
  # 1. Web App (Node.js / pnpm)
  # ============================================================================
  web-app:
    name: Web App (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: |
          pnpm config set auto-install-peers true
          pnpm install --no-frozen-lockfile

      - name: Type Check
        run: pnpm run type

      - name: Lint
        run: pnpm run lint

      - name: Unit Tests
        run: pnpm test

      - name: Build Web App
        run: pnpm build --filter @mmup/web

  # ============================================================================
  # 2. Go Backend (35 서비스 빌드 + 테스트)
  # ============================================================================
  go-backend:
    name: Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Go vet (정적 분석)
        run: go vet ./...

      - name: Build all services
        run: |
          FAILED=()
          for dir in services/*/; do
            svc=$(basename "$dir")
            echo "::group::Building $svc"
            if ! go build "./$dir..."; then
              FAILED+=("$svc")
              echo "::error::Build failed: $svc"
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED[@]} -ne 0 ]; then
            echo "::error::Failed builds: ${FAILED[*]}"
            exit 1
          fi

      - name: Run tests
        run: |
          go test ./... -count=1 -timeout 300s -v 2>&1 | tee test-output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "=== Test Summary ==="
          grep -cE "^--- PASS:" test-output.txt || echo "0 passed"
          grep -cE "^--- FAIL:" test-output.txt || echo "0 failed"
          exit $TEST_EXIT

  # ============================================================================
  # 3. Flutter App (분석 + 테스트)
  # ============================================================================
  flutter-app:
    name: Flutter App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/flutter-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosiatech/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze (정적 분석)
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Flutter evidence UI gate: contract
        run: bash ../../scripts/flutter_evidence_ui_gate.sh --category contract

      - name: Flutter evidence UI gate: ui
        run: bash ../../scripts/flutter_evidence_ui_gate.sh --category ui

      - name: Flutter evidence UI gate: data
        run: bash ../../scripts/flutter_evidence_ui_gate.sh --category data

      - name: Flutter web release gate
        run: bash ../../scripts/flutter_web_release_gate.sh

      - name: Flutter web timing report
        run: |
          branch_type="release_branch"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            branch_type="pull_request"
          fi
          bash ../../scripts/flutter_web_timing_report.sh \
            --log /tmp/manpasik_flutter_web_build.log \
            --branch-type "$branch_type" \
            --runner-context "${{ runner.os }}-${{ runner.arch }}" \
            --output /tmp/manpasik_flutter_web_timing.env

      - name: Upload Flutter web timing report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-timing-report
          path: /tmp/manpasik_flutter_web_timing.env

  # ============================================================================
  # 4. Rust Core (빌드 + 테스트)
  # ============================================================================
  rust-core:
    name: Rust Core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust-core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace

      - name: Clippy (린트)
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace
