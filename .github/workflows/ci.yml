name: CI pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  GO_VERSION: '1.22'
  FLUTTER_VERSION: '3.32.0'
  RUST_TOOLCHAIN: 'stable'

jobs:
  # ============================================================================
  # 0. SSOT Governance (상수/문서 일치성)
  # ============================================================================
  ssot-governance:
    name: SSOT Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SSOT constants
        run: python3 scripts/validate_ssot_constants.py

      - name: Security release gate
        run: bash scripts/security_release_gate.sh

      - name: Assay evidence gate
        run: bash scripts/assay_evidence_gate.sh

      - name: Flutter evidence UI gate policy
        run: bash scripts/flutter_evidence_ui_gate_policy_test.sh

      - name: Flutter web timing collection policy
        run: bash scripts/ci_web_gate_timing_collection_policy_test.sh

      - name: Flutter web timing threshold promotion policy
        run: bash scripts/ci_web_timing_threshold_promotion_policy_test.sh

      - name: Flutter web timing review fixture policy
        run: bash scripts/ci_web_timing_review_fixture_policy_test.sh

      - name: Flutter web release review checklist policy
        run: bash scripts/ci_web_release_review_checklist_policy_test.sh

      - name: Flutter web timing governance index policy
        run: bash scripts/ci_web_timing_governance_index_policy_test.sh

  # ============================================================================
  # 1. Web App (Node.js / pnpm)
  # ============================================================================
  web-app:
    name: Web App (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: |
          pnpm config set auto-install-peers true
          pnpm install --no-frozen-lockfile

      - name: Type Check
        run: pnpm run type

      - name: Lint
        run: pnpm run lint

      - name: Unit Tests
        run: pnpm test

      - name: Build Web App
        run: pnpm build --filter @mmup/web

  # ============================================================================
  # 2. Go Backend (35 서비스 빌드 + 테스트)
  # ============================================================================
  go-backend:
    name: Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Go vet (정적 분석)
        run: go vet ./...

      - name: Build all services
        run: |
          FAILED=()
          for dir in services/*/; do
            svc=$(basename "$dir")
            echo "::group::Building $svc"
            if ! go build "./$dir..."; then
              FAILED+=("$svc")
              echo "::error::Build failed: $svc"
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED[@]} -ne 0 ]; then
            echo "::error::Failed builds: ${FAILED[*]}"
            exit 1
          fi

      - name: Run tests
        run: |
          go test ./... -count=1 -timeout 300s -v 2>&1 | tee test-output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "=== Test Summary ==="
          grep -cE "^--- PASS:" test-output.txt || echo "0 passed"
          grep -cE "^--- FAIL:" test-output.txt || echo "0 failed"
          exit $TEST_EXIT

  # ============================================================================
  # 3. Flutter App (분석 + 테스트)
  # ============================================================================
  flutter-app:
    name: Flutter App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/flutter-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosiatech/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze (정적 분석)
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Flutter evidence UI gate: contract
        run: bash ../../scripts/flutter_evidence_ui_gate.sh --category contract

      - name: Flutter evidence UI gate: ui
        run: bash ../../scripts/flutter_evidence_ui_gate.sh --category ui

      - name: Flutter evidence UI gate: data
        run: bash ../../scripts/flutter_evidence_ui_gate.sh --category data

      - name: Flutter web release gate
        run: bash ../../scripts/flutter_web_release_gate.sh

      - name: Flutter web timing report
        run: |
          branch_type="release_branch"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            branch_type="pull_request"
          fi
          bash ../../scripts/flutter_web_timing_report.sh \
            --log /tmp/manpasik_flutter_web_build.log \
            --branch-type "$branch_type" \
            --runner-context "${{ runner.os }}-${{ runner.arch }}" \
            --output /tmp/manpasik_flutter_web_timing.env

      - name: Upload Flutter web timing report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-timing-report
          path: /tmp/manpasik_flutter_web_timing.env

  # ============================================================================
  # 4. Rust Core (빌드 + 테스트)
  # ============================================================================
  rust-core:
    name: Rust Core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust-core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace

      - name: Clippy (린트)
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  # ============================================================================
  # 5. Security Scanning (보안 스캔)
  # ============================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [go-backend, rust-core]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Go — gosec 정적 보안 분석
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec (Go security scan)
        working-directory: backend
        run: |
          gosec -fmt sarif -out ../gosec-results.sarif ./... || true
          gosec -fmt text ./... || echo "::warning::gosec 발견 사항 존재"

      # Rust — cargo audit 취약점 검사
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit (Rust dependency audit)
        working-directory: rust-core
        run: cargo audit || echo "::warning::cargo audit 취약점 발견"

      # Container — Trivy 이미지 스캔
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          format: "table"

  # ============================================================================
  # 6. Load Tests (k6 부하 테스트)
  # ============================================================================
  load-test:
    name: Load Tests (k6)
    runs-on: ubuntu-latest
    needs: [go-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6 -y

      - name: Run API gateway load test
        working-directory: tests/load
        run: k6 run --vus 10 --duration 30s api_gateway_load_test.js || echo "::warning::Gateway load test completed with issues"
        env:
          BASE_URL: ${{ vars.LOAD_TEST_BASE_URL || 'http://localhost:8080' }}

      - name: Run auth load test
        working-directory: tests/load
        run: k6 run --vus 10 --duration 30s auth_load_test.js || echo "::warning::Auth load test completed with issues"
        env:
          BASE_URL: ${{ vars.LOAD_TEST_BASE_URL || 'http://localhost:8080' }}

      - name: Run measurement load test
        working-directory: tests/load
        run: k6 run --vus 5 --duration 30s measurement_load_test.js || echo "::warning::Measurement load test completed with issues"
        env:
          BASE_URL: ${{ vars.LOAD_TEST_BASE_URL || 'http://localhost:8080' }}

  # ============================================================================
  # 7. E2E Integration Tests
  # ============================================================================
  e2e-test:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    needs: [go-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Start services with Docker Compose
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose up -d --wait --timeout 120
          elif [ -f infrastructure/docker-compose.yml ]; then
            docker compose -f infrastructure/docker-compose.yml up -d --wait --timeout 120
          else
            echo "::warning::No docker-compose.yml found, running E2E tests against external services"
          fi

      - name: Wait for services to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health --connect-timeout 5 2>/dev/null; then
              echo "Services are ready"
              break
            fi
            echo "Waiting for services... (attempt $i/30)"
            sleep 5
          done

      - name: Run E2E tests
        working-directory: tests/e2e
        run: go test -v -count=1 -timeout 600s ./... 2>&1 | tee e2e-results.txt
        env:
          GATEWAY_ADDR: "localhost:8080"
          AUTH_SERVICE_ADDR: "localhost:50051"
          USER_SERVICE_ADDR: "localhost:50052"
          DEVICE_SERVICE_ADDR: "localhost:50053"
          MEASUREMENT_SERVICE_ADDR: "localhost:50054"
          IOT_GATEWAY_SERVICE_ADDR: "localhost:50072"
          NLP_SERVICE_ADDR: "localhost:50074"
          MARKETPLACE_SERVICE_ADDR: "localhost:50075"

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: tests/e2e/e2e-results.txt

      - name: Teardown Docker Compose
        if: always()
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose down -v
          elif [ -f infrastructure/docker-compose.yml ]; then
            docker compose -f infrastructure/docker-compose.yml down -v
          fi
