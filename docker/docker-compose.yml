version: '3.8'

services:
  # 웹 프론트엔드 (Next.js Monorepo Standalone)
  mmup-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: mmup-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # 추가 환경 변수를 여기에 선언
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mmup-network

  # 보안/로드밸런싱 목적의 Nginx 웹 서버
  nginx:
    image: nginx:alpine
    container_name: mmup-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mmup-web
    networks:
      - mmup-network

networks:
  mmup-network:
    driver: bridge
